global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: atlaspipe-api
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: atlaspipe-worker
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8081
        refresh_interval: 15s
