[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlaspipe"
version = "0.1.0"
description = "Async web metadata ingestion pipeline with PostgreSQL and FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "AtlasPipe Contributors" }
]
dependencies = [
  "aiohttp>=3.10,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<25",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "black>=24.8,<25",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<6",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
atlaspipe = "atlaspipe.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlaspipe"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
  "S101"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlaspipe"]
