services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlaspipe
      POSTGRES_PASSWORD: atlaspipe
      POSTGRES_DB: atlaspipe
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlaspipe -d atlaspipe"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://atlaspipe:atlaspipe@postgres:5432/atlaspipe
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://atlaspipe:atlaspipe@postgres:5432/atlaspipe
      API_KEY: ${API_KEY:?Run scripts/configure_local.py first}
      METRICS_KEY: ${METRICS_KEY:?Run scripts/configure_local.py first}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MAX_CONCURRENCY: 10
      PER_DOMAIN_CONCURRENCY: 2
      REQUESTS_PER_SECOND: 5
      REQUEST_TIMEOUT: 10
      MAX_RETRIES: 3
      BATCH_SIZE: 100
      USER_AGENT: AtlasPipe/0.1 (+https://example.invalid/atlaspipe)
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["atlaspipe-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://atlaspipe:atlaspipe@postgres:5432/atlaspipe
      METRICS_KEY: ${METRICS_KEY:?Run scripts/configure_local.py first}
      WORKER_METRICS_PORT: 8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      MAX_CONCURRENCY: 10
      PER_DOMAIN_CONCURRENCY: 2
      REQUESTS_PER_SECOND: 5
      REQUEST_TIMEOUT: 10
      MAX_RETRIES: 3
      BATCH_SIZE: 100
      FRONTIER_LEASE_SECONDS: 60
      FRONTIER_POLL_INTERVAL_SECONDS: 1
      USER_AGENT: AtlasPipe/0.1 (+https://example.invalid/atlaspipe)
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "atlaspipe.worker_health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.local-secrets/metrics-token:/etc/prometheus/metrics-token:ro
    ports: ["127.0.0.1:9090:9090"]

  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./observability/collector.yml:/etc/otel/config.yml:ro"]

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes: ["./observability/tempo.yml:/etc/tempo/config.yml:ro"]

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/configure_local.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]

volumes:
  postgres_data:
