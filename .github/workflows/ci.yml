name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlaspipe
          POSTGRES_PASSWORD: atlaspipe
          POSTGRES_DB: atlaspipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlaspipe -d atlaspipe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://atlaspipe:atlaspipe@localhost:5432/atlaspipe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - name: Expand migration and drift checks
        run: |
          uv run --frozen alembic upgrade 20260922_0004
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - run: uv run --frozen pytest --junitxml=artifacts/tests.xml
      - name: Dependency security
        run: uv run --frozen pip-audit --local --skip-editable --format json --output artifacts/dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: quality-evidence, path: artifacts/}
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.sha }}"}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: {terraform_version: "1.10.5"}
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - name: Mock provider security plan (no AWS)
        run: terraform -chdir=infra test
      - name: Verify Prometheus rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/rules:ro" -w /rules prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability:/rules:ro" -w /rules prom/prometheus:v3.5.0 test rules alerts.test.yml
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlaspipe
          POSTGRES_PASSWORD: atlaspipe
          POSTGRES_DB: atlaspipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlaspipe -d atlaspipe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://atlaspipe:atlaspipe@localhost:5432/atlaspipe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.sha }}"}
      - run: docker build -t atlaspipe:${{ github.sha }} .
      - name: Verify container runtime and PostgreSQL
        run: |
          docker run --rm --network host -e DATABASE_URL atlaspipe:${{ github.sha }} alembic upgrade head
          docker run --rm --network host -e DATABASE_URL -v "$PWD/scripts/container_smoke.py:/smoke.py:ro" atlaspipe:${{ github.sha }} python /smoke.py
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlaspipe:${{ github.sha }}
          format: json
          output: image-scan.json
          exit-code: "1"
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: image-evidence, path: image-scan.json}
