name: Approved demo release
on:
  workflow_dispatch:
    inputs:
      inject_broken_release:
        type: boolean
        default: false
        description: "Approved demo experiment: deliberately fail app containers and verify rollback"
permissions:
  contents: read
concurrency:
  group: atlaspipe-demo-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      DEPLOYMENT_JSON: ${{ vars.DEPLOYMENT_JSON }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SMOKE_CRAWL_URL: ${{ vars.SMOKE_CRAWL_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      INJECT_BROKEN_RELEASE: ${{ inputs.inject_broken_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: |
          python -m pip install uv==0.13.0
          uv sync --frozen --extra dev
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare deployment configuration
        run: |
          mkdir -p work artifacts
          python -c 'import json,os; from pathlib import Path; data=json.loads(os.environ["DEPLOYMENT_JSON"]); Path("work/deployment.json").write_text(json.dumps(data))'
      - name: Build immutable source
        run: docker build -t atlaspipe-release .
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: atlaspipe-release
          format: json
          output: artifacts/image-scan.json
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Publish immutable image
        id: image
        run: |
          set -euo pipefail
          registry="${REPOSITORY_URL%%/*}"
          repository="${REPOSITORY_URL#*/}"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag atlaspipe-release "$REPOSITORY_URL:$tag"
          docker push "$REPOSITORY_URL:$tag"
          digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          printf 'image=%s@%s\n' "$REPOSITORY_URL" "$digest" >> "$GITHUB_OUTPUT"
      - name: Migrate, deploy, verify and restore on failure
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          extra=()
          if [[ "$INJECT_BROKEN_RELEASE" == "true" ]]; then extra+=(--inject-broken-release); fi
          uv run --frozen python -m atlaspipe.release --config work/deployment.json --image "$RELEASE_IMAGE" --output artifacts/release-outcome.json "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: release-evidence, path: artifacts/}
